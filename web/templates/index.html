<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <link rel="stylesheet" href="/static/highlight-theme.min.css?v={{ cache_version }}">
    <link rel="stylesheet" href="/static/katex.min.css?v={{ cache_version }}">
    <link rel="stylesheet" href="/static/style.css?v={{ cache_version }}">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>对话列表</h2>
            <button class="btn-new-chat" id="btn-new-chat" title="新对话">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </div>
        <div class="conv-search">
            <svg class="conv-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="conv-search-input" placeholder="搜索对话" autocomplete="off">
        </div>
        <div class="conv-list-wrap">
            <div class="conv-list" id="conv-list"></div>
        </div>
        <div class="sidebar-import">
            <button class="btn-settings" id="btn-import-convs">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                导入对话
            </button>
            <input type="file" id="import-file-input" accept="application/json,.json" style="display:none;">
        </div>
        <div class="sidebar-footer">
            <button class="btn-settings" id="btn-settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"></path>
                </svg>
                设置
            </button>
        </div>
    </aside>

    <div class="sidebar-resizer" id="sidebar-resizer" title="拖动调整宽度"></div>

    <div class="main">
        <header class="header">
            <button class="btn-toggle-sidebar" id="btn-toggle-sidebar" title="菜单">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <h1 id="header-title">AI Chat</h1>
        </header>

        <main class="chat-area" id="chat-area">
            <div class="welcome" id="welcome">
                <div class="welcome-icon">✦</div>
                <h2>你好，有什么可以帮你的？</h2>
                <p>选择左侧对话或新建一个开始聊天</p>
            </div>
        </main>

        <footer class="input-area">
            <div class="agent-bar-row">
                <div class="agent-selector" id="agent-selector">
                    <button class="agent-selector-btn" id="agent-selector-btn">
                        <div class="agent-selector-avatar" id="agent-selector-avatar">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14">
                                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>
                        <span class="agent-selector-name" id="agent-selector-name">通用助手</span>
                        <svg class="agent-selector-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                    <div class="agent-dropdown" id="agent-dropdown">
                        <div class="agent-dropdown-list" id="agent-dropdown-list"></div>
                        <div class="agent-dropdown-footer">
                            <button class="agent-dropdown-manage" id="agent-dropdown-manage">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                                    <circle cx="12" cy="12" r="3"></circle>
                                    <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"></path>
                                </svg>
                                管理智能体
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="image-preview-bar" id="image-preview-bar"></div>
            <div class="input-wrapper">
                <button class="btn-attach" id="btn-attach" title="上传图片或文档">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"></path>
                    </svg>
                </button>
                <button class="btn-attach btn-websearch" id="btn-websearch" title="联网搜索（点亮后本次提问会先全网检索再回答）">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"></path>
                    </svg>
                </button>
                <input type="file" id="image-file-input" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.md,.json,.xml,.html,.log,.py,.js,.java,.c,.cpp,.go,.rs,.ts,.sh,.yaml,.yml,.ini,.conf,.cfg,.toml" multiple style="display:none;">
                <textarea id="user-input" placeholder="输入消息... (Enter 发送，Shift+Enter 换行)" rows="1"></textarea>
                <button class="btn-send" id="btn-send" title="发送">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <path d="M22 2L11 13"></path>
                        <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
                    </svg>
                </button>
                <button class="btn-stop" id="btn-stop" title="中断生成" style="display:none;">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                        <rect x="6" y="6" width="12" height="12" rx="2"></rect>
                    </svg>
                </button>
            </div>
            <div class="footer-bar">
                <div class="model-bar" id="model-bar">
                    <select id="quick-model" class="quick-model-select"></select>
                    <button class="btn-manage-models" id="btn-open-model-manager" title="管理模型">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"></path>
                        </svg>
                    </button>
                    <button class="btn-manage-models" id="btn-manage-models" title="新增模型">+</button>
                </div>
            </div>
        </footer>
    </div>

    <div class="settings-overlay" id="settings-overlay">
        <div class="settings-panel" id="settings-panel">
            <div class="settings-header">
                <h2>设置</h2>
                <button class="btn-close-settings" id="btn-close-settings">✕</button>
            </div>
            <div class="settings-body">
                <div class="setting-group">
                    <div class="setting-row">
                        <label class="setting-label">浅色主题</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="set-light-theme">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="setting-hint">开启后切换为浅色界面（默认深色），选择会被记住</div>
                </div>
                <div class="setting-group">
                    <label class="setting-label">聊天字号</label>
                    <div class="setting-hint">调节聊天气泡文字大小，范围 8-40px</div>
                    <div class="setting-row" style="gap:12px;">
                        <input type="range" id="set-chat-font-size" min="8" max="40" step="1" value="14" style="flex:1;">
                        <span id="chat-font-size-value" style="min-width:42px;text-align:right;color:var(--text-secondary);">14px</span>
                    </div>
                </div>
                <div class="setting-group">
                    <label class="setting-label">上下文轮数限制</label>
                    <div class="setting-hint">0 = 不限制，建议 20-50</div>
                    <input type="number" id="set-max-rounds" class="setting-input" min="0" max="200" placeholder="50">
                </div>
                <div class="setting-group">
                    <label class="setting-label">上下文大小限制</label>
                    <div class="setting-hint">单位 K，0 = 不限制，建议 512-4096</div>
                    <input type="number" id="set-max-context-size" class="setting-input" min="0" max="65536" step="64" placeholder="2048">
                </div>
                <div class="setting-group">
                    <div class="setting-row">
                        <label class="setting-label" for="set-auto-compress">自动压缩</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="set-auto-compress">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="setting-hint">关闭：则直接丢弃最早对话（在上下文轮数配置）；开启：智能压缩超出阈值的对话</div>
                    <div class="setting-sub" id="compress-threshold-row" style="display:none;">
                        <label class="setting-label">超出多少开始压缩</label>
                        <div class="setting-hint">单位 K，历史超过此大小后自动压缩</div>
                        <input type="number" id="set-compress-threshold" class="setting-input" min="1" max="65536" step="1" placeholder="8">
                    </div>
                </div>
            </div>
            <div class="settings-footer">
                <button class="btn-save-settings" id="btn-save-settings">保存设置</button>
            </div>
        </div>
    </div>

    <div class="model-manage-overlay" id="model-manage-overlay">
        <div class="model-manage-panel">
            <div class="settings-header">
                <h2 id="model-config-title">新增模型</h2>
                <button class="btn-close-settings" id="btn-close-manage">✕</button>
            </div>
            <div class="settings-body">
                <div class="setting-group">
                    <label class="setting-label">AI 服务商</label>
                    <select id="add-provider" class="setting-select"></select>
                </div>
                <div class="setting-group">
                    <label class="setting-label">API 地址</label>
                    <input type="text" id="set-base-url" class="setting-input" placeholder="https://api.xxx.com/v1/chat/completions">
                </div>
                <div class="setting-group">
                    <label class="setting-label">模型</label>
                    <select id="add-model" class="setting-select"></select>
                    <input type="text" id="add-model-custom" class="setting-input" placeholder="自定义模型名称" style="display:none;margin-top:8px;">
                </div>
                <div class="setting-group">
                    <label class="setting-label">API Key</label>
                    <input type="password" id="set-api-key" class="setting-input" placeholder="sk-xxxxxxxxxxxx">
                    <div class="key-status" id="key-status"></div>
                </div>
                <div class="setting-group">
                    <button class="btn-save-settings" id="btn-save-api-config" style="width:100%;">保存配置</button>
                </div>
            </div>
        </div>
    </div>

    <div class="model-manage-overlay" id="model-list-overlay">
        <div class="model-manage-panel">
            <div class="settings-header">
                <h2>管理模型</h2>
                <button class="btn-close-settings" id="btn-close-model-list">✕</button>
            </div>
            <div class="settings-body">
                <div class="setting-group">
                    <label class="setting-label">已保存的模型</label>
                    <div id="custom-model-list" class="custom-model-list scrollable-list"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="agent-overlay" id="agent-overlay">
        <div class="agent-panel">
            <div class="settings-header">
                <h2 id="agent-panel-title">管理智能体</h2>
                <button class="btn-close-settings" id="btn-close-agent-panel">✕</button>
            </div>
            <div class="settings-body" id="agent-panel-body">
                <div id="agent-list-view">
                    <div class="agent-grid" id="agent-grid"></div>
                    <button class="btn-create-agent" id="btn-create-agent">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        创建新智能体
                    </button>
                </div>
                <div id="agent-form-view" style="display:none;">
                    <div class="agent-avatar-section">
                        <div class="agent-avatar-preview" id="agent-avatar-preview">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="32" height="32">
                                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>
                        <label class="btn-upload-avatar" id="btn-upload-avatar">
                            上传头像
                            <input type="file" id="agent-avatar-input" accept="image/*" style="display:none;">
                        </label>
                    </div>
                    <div class="setting-group">
                        <label class="setting-label">名称</label>
                        <input type="text" id="agent-name" class="setting-input" placeholder="例如：翻译助手">
                    </div>
                    <div class="setting-group">
                        <label class="setting-label">系统提示词</label>
                        <textarea id="agent-prompt" class="setting-textarea" rows="5" placeholder="定义这个智能体的角色和行为..."></textarea>
                    </div>
                    <div class="setting-group">
                        <label class="setting-label">绑定模型（留空则使用全局设置）</label>
                        <span class="field-sublabel">服务商</span>
                        <select id="agent-provider" class="setting-select">
                            <option value="">使用全局模型</option>
                        </select>
                        <span class="field-sublabel" style="margin-top:8px;">模型</span>
                        <select id="agent-model" class="setting-select">
                            <option value="">使用全局模型</option>
                        </select>
                    </div>
                    <div class="setting-group agent-callable-section">
                        <div class="callable-toggle-row">
                            <label class="setting-label">可被其他智能体调用</label>
                            <label class="toggle-switch">
                                <input type="checkbox" id="agent-callable">
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                        <div id="callable-fields" style="display:none;">
                            <div class="setting-group" style="margin-top:12px;">
                                <label class="setting-label">英文标识名 <span class="required">*</span></label>
                                <input type="text" id="agent-slug" class="setting-input" placeholder="例如：code-reviewer" maxlength="50">
                                <div class="input-hint">被调用时的唯一英文标识名称</div>
                            </div>
                            <div class="setting-group" style="margin-top:12px;">
                                <label class="setting-label">何时调用 <span class="required">*</span></label>
                                <textarea id="agent-when-to-call" class="setting-textarea" rows="3" placeholder="描述其他智能体调用该智能体的合适场景和时机"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="agent-form-actions" id="agent-form-actions" style="display:none;">
                <button class="btn-agent-cancel" id="btn-agent-cancel">取消</button>
                <button class="btn-agent-save" id="btn-agent-save">保存</button>
            </div>
        </div>
    </div>

    <div class="confirm-overlay" id="confirm-overlay">
        <div class="confirm-dialog">
            <div class="confirm-icon" id="confirm-icon">⚠️</div>
            <h3 class="confirm-title" id="confirm-title">确认操作</h3>
            <p class="confirm-message" id="confirm-message"></p>
            <div class="confirm-actions">
                <button class="confirm-btn confirm-cancel" id="confirm-cancel">取消</button>
                <button class="confirm-btn confirm-ok" id="confirm-ok">确定</button>
            </div>
        </div>
    </div>

    <div class="confirm-overlay" id="prompt-overlay">
        <div class="confirm-dialog">
            <h3 class="confirm-title" id="prompt-title">重命名</h3>
            <input type="text" class="prompt-input" id="prompt-input" autocomplete="off">
            <div class="confirm-actions">
                <button class="confirm-btn confirm-cancel" id="prompt-cancel">取消</button>
                <button class="confirm-btn confirm-ok" id="prompt-ok">保存</button>
            </div>
        </div>
    </div>
    <script src="/static/highlight.min.js?v={{ cache_version }}"></script>
    <script src="/static/marked.min.js?v={{ cache_version }}"></script>
    <script src="/static/katex.min.js?v={{ cache_version }}"></script>
    <script src="/static/katex-auto-render.min.js?v={{ cache_version }}"></script>
    <script src="/static/app.js?v={{ cache_version }}"></script>
</body>
</html>
